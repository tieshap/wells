<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wells Fargo - Accounts</title>
  <link rel="stylesheet" href="css/dashboard.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-init.js"></script>
  <script src="js/auth.js"></script>
</head>
<body class="dashboard-body">

  <!-- Top Bar -->
  <header class="dash-topbar">
    <div class="dash-top-right">
      <button class="dash-icon-btn">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
      </button>
      <button class="dash-signout-btn" onclick="signOut()">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
        Sign Off
      </button>
    </div>
  </header>

  <!-- Main -->
  <div class="dash-container" id="app">

    <!-- Loading State -->
    <div class="dash-loading" id="loading-state">
      <div class="dash-loading-spinner"></div>
      <p>Loading your accounts...</p>
    </div>

    <!-- Main Accounts View -->
    <div class="dash-main-view" id="main-view" style="display:none;">
      <div class="dash-header">
        <h1 id="dash-greeting">Good afternoon,</h1>
        <h2 id="dash-user-name-title">WILLIAM</h2>
        <p id="dash-subtitle">Customer since 2002</p>
      </div>

      <div class="dash-accounts-grid" id="accounts-grid"></div>

      <!-- FICO Score Card -->
      <div class="dash-fico-card">
        <svg width="36" height="36" viewBox="0 0 36 36">
          <path d="M 9,26 A 12,12 0 0,1 10,12" fill="none" stroke="#D32F2F" stroke-width="4" stroke-linecap="round"/>
          <path d="M 14,9 A 12,12 0 0,1 24,9" fill="none" stroke="#FBC02D" stroke-width="4" stroke-linecap="round"/>
          <path d="M 27,13 A 12,12 0 0,1 26,26" fill="none" stroke="#388E3C" stroke-width="4" stroke-linecap="round"/>
        </svg>
        <span>View your FICO® Credit Score</span>
      </div>

      <!-- Footer Text -->
      <div class="dash-footer-text">
        <p>Deposit products offered by Wells Fargo Bank,<br>N.A. Member FDIC.</p>
        <p class="dash-equal-housing">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 10l9-7 9 7v11H3V10z"></path>
            <line x1="8" y1="14" x2="16" y2="14"></line>
            <line x1="8" y1="18" x2="16" y2="18"></line>
          </svg>
          Equal Housing Lender
        </p>
      </div>

      <h2 class="dash-section-title">
        <span>📋</span> Recent Transactions
      </h2>
      <div class="dash-transactions" id="transactions-list">
        <div class="dash-no-transactions">Select an account to view transactions</div>
      </div>
    </div>

    <!-- Account Detail View -->
    <div class="dash-account-detail" id="account-detail">
      <div id="account-detail-content"></div>
    </div>

  </div>

  <script>
    // ======================== SESSION CHECK ========================
    (async function() {
      var user = await getCurrentUser();
      if (!user) {
        window.location.href = 'auth.html';
        return;
      }

      var profile = await getUserProfile();

      // Set greeting
      var hour = (new Date()).getHours();
      var greeting;
      if (hour >= 3 && hour <= 11) greeting = 'Good morning';
      else if (hour >= 12 && hour <= 17) greeting = 'Good afternoon';
      else greeting = 'Good evening';
      document.getElementById('dash-greeting').innerText = greeting + ',';

      // Set user info
      var name = profile?.full_name || user.email;
      var firstName = name.split(' ')[0].toUpperCase();
      document.getElementById('dash-user-name-title').innerText = firstName;
      document.getElementById('dash-subtitle').innerText = 'Customer since 2002';

      // Show admin link
      if (profile?.is_admin) {
        document.getElementById('admin-link').style.display = 'inline';
        document.getElementById('admin-link').href = 'edit.html';
      }

      // Load accounts
      await loadAccounts();
    })();

    // ======================== LOAD ACCOUNTS ========================
    async function loadAccounts() {
      document.getElementById('loading-state').style.display = 'block';
      document.getElementById('main-view').style.display = 'none';

      var accounts = await getUserAccounts();

      document.getElementById('loading-state').style.display = 'none';
      document.getElementById('main-view').style.display = 'block';

      var grid = document.getElementById('accounts-grid');
      grid.innerHTML = '';

      if (accounts.length === 0) {
        // Seed default accounts for new users
        await seedDefaultAccounts();
        accounts = await getUserAccounts();
      }

      var allTransactions = [];

      accounts.forEach(function(account) {
        var card = document.createElement('div');
        card.className = 'dash-account-card';
        card.onclick = function() { showAccountDetail(account.id); };

        var accountName = account.type === 'checking' ? 'EVERYDAY CHECKING' : account.type === 'savings' ? 'SAVINGS' : 'PLATINUM CARD';
        if (account.account_number.startsWith('9')) accountName = 'WAY2SAVE® CHECKING';
        if (account.account_number.startsWith('4305')) accountName = 'STOCKS';

        card.innerHTML = `
          <div class="dash-account-meta">
            <h3>${accountName} ...${account.account_number.slice(-4)}</h3>
          </div>
          <div class="dash-account-balance">
            ${account.type === 'credit_card' ? '-' : ''}${formatCurrency(account.balance)}
          </div>
          <div class="dash-account-avail">
            Available balance
          </div>
        `;

        grid.appendChild(card);

        // Load transactions for this account
        getAccountTransactions(account.id).then(function(txs) {
          txs.forEach(function(tx) {
            tx.accountType = account.type;
            tx.accountLabel = getAccountLabel(account.type);
          });
          allTransactions = allTransactions.concat(txs);
          renderAllTransactions(allTransactions, accounts);
        });
      });
    }

    // ======================== SEED DEFAULT ACCOUNTS ========================
    async function seedDefaultAccounts() {
      var user = await getCurrentUser();
      if (!user) return;

      var profile = await getUserProfile();
      
      // Check if accounts already exist
      var existing = await getUserAccounts();
      if (existing.length > 0) return;

      var accounts = [
        {
          user_id: user.id,
          type: 'checking',
          account_number: '7890123456',
          balance: 4520.75,
          credit_limit: null
        },
        {
          user_id: user.id,
          type: 'savings',
          account_number: '9876543210',
          balance: 12350.00,
          credit_limit: null
        },
        {
          user_id: user.id,
          type: 'credit_card',
          account_number: '4000123456789012',
          balance: 1250.00,
          credit_limit: 10000.00
        }
      ];

      for (var i = 0; i < accounts.length; i++) {
        var { data, error } = await supabase
          .from('accounts')
          .insert(accounts[i])
          .select()
          .single();

        if (data) {
          // Seed some transactions for this account
          await seedTransactions(data.id, data.type);
        }
      }
    }

    // ======================== SEED TRANSACTIONS ========================
    async function seedTransactions(accountId, type) {
      var transactions = [];
      var now = new Date();

      if (type === 'checking') {
        transactions = [
          { account_id: accountId, date: new Date(now.getTime() - 1*86400000).toISOString().split('T')[0], description: 'Direct Deposit - EMPLOYER INC', amount: 2450.00, type: 'credit', category: 'income' },
          { account_id: accountId, date: new Date(now.getTime() - 3*86400000).toISOString().split('T')[0], description: 'ATM Withdrawal', amount: 200.00, type: 'debit', category: 'withdrawal' },
          { account_id: accountId, date: new Date(now.getTime() - 5*86400000).toISOString().split('T')[0], description: 'Online Payment - ELECTRIC BILL', amount: 145.30, type: 'debit', category: 'bills' },
          { account_id: accountId, date: new Date(now.getTime() - 7*86400000).toISOString().split('T')[0], description: 'Online Transfer - TO SAVINGS', amount: 500.00, type: 'debit', category: 'transfer' },
          { account_id: accountId, date: new Date(now.getTime() - 10*86400000).toISOString().split('T')[0], description: 'Grocery Store - TRADER JOE', amount: 87.45, type: 'debit', category: 'food' }
        ];
      } else if (type === 'savings') {
        transactions = [
          { account_id: accountId, date: new Date(now.getTime() - 2*86400000).toISOString().split('T')[0], description: 'Interest Payment', amount: 12.50, type: 'credit', category: 'interest' },
          { account_id: accountId, date: new Date(now.getTime() - 7*86400000).toISOString().split('T')[0], description: 'Online Transfer - FROM CHECKING', amount: 500.00, type: 'credit', category: 'transfer' },
          { account_id: accountId, date: new Date(now.getTime() - 14*86400000).toISOString().split('T')[0], description: 'Online Transfer - FROM CHECKING', amount: 300.00, type: 'credit', category: 'transfer' }
        ];
      } else if (type === 'credit_card') {
        transactions = [
          { account_id: accountId, date: new Date(now.getTime() - 1*86400000).toISOString().split('T')[0], description: 'AMAZON.COM', amount: 67.99, type: 'debit', category: 'shopping' },
          { account_id: accountId, date: new Date(now.getTime() - 3*86400000).toISOString().split('T')[0], description: 'UBER TRIP', amount: 24.56, type: 'debit', category: 'transport' },
          { account_id: accountId, date: new Date(now.getTime() - 5*86400000).toISOString().split('T')[0], description: 'NETFLIX.COM', amount: 15.99, type: 'debit', category: 'entertainment' },
          { account_id: accountId, date: new Date(now.getTime() - 8*86400000).toISOString().split('T')[0], description: 'Payment Received - THANK YOU', amount: 250.00, type: 'credit', category: 'payment' }
        ];
      }

      for (var i = 0; i < transactions.length; i++) {
        await supabase.from('transactions').insert(transactions[i]);
      }
    }

    // ======================== RENDER TRANSACTIONS ========================
    function renderAllTransactions(transactions, accounts) {
      var container = document.getElementById('transactions-list');
      container.innerHTML = '';

      // Sort by date desc
      transactions.sort(function(a, b) { return new Date(b.date) - new Date(a.date); });
      transactions = transactions.slice(0, 20);

      if (transactions.length === 0) {
        container.innerHTML = '<div class="dash-no-transactions">No recent transactions</div>';
        return;
      }

      transactions.forEach(function(tx) {
        var isCredit = tx.type === 'credit';
        var item = document.createElement('div');
        item.className = 'dash-transaction-item';
        item.innerHTML = `
          <div class="dash-tx-icon ${isCredit ? 'tx-credit' : 'tx-debit'}">${isCredit ? '↓' : '↑'}</div>
          <div class="dash-tx-info">
            <div class="dash-tx-desc">${tx.description}</div>
            <div class="dash-tx-date">${formatDate(tx.date)} · ${tx.accountLabel || ''}</div>
          </div>
          <div class="dash-tx-amount ${isCredit ? 'tx-credit-amount' : 'tx-debit-amount'}">
            ${isCredit ? '+' : '-'}${formatCurrency(tx.amount)}
          </div>
        `;
        container.appendChild(item);
      });
    }

    // ======================== ACCOUNT DETAIL VIEW ========================
    async function showAccountDetail(accountId) {
      document.getElementById('main-view').style.display = 'none';
      var detail = document.getElementById('account-detail');
      detail.style.display = 'block';

      var content = document.getElementById('account-detail-content');
      content.innerHTML = '<div class="dash-loading"><div class="dash-loading-spinner"></div><p>Loading account details...</p></div>';

      var { data: account } = await supabase
        .from('accounts')
        .select('*')
        .eq('id', accountId)
        .single();

      var transactions = await getAccountTransactions(accountId);

      var balanceColor = account.type === 'credit_card' ? '#c62828' : '#222';
      var badgeClass = account.type === 'checking' ? 'badge-checking' : account.type === 'savings' ? 'badge-savings' : 'badge-credit';

      var html = `
        <div class="dash-account-card" style="margin-bottom:20px;cursor:default;">
          <div class="dash-account-card-header">
            <div class="dash-account-icon">${getAccountIcon(account.type)}</div>
            <div class="dash-account-meta">
              <h3>${getAccountLabel(account.type)}</h3>
              <span>Account #****${account.account_number.slice(-4)}</span>
            </div>
            <span class="dash-account-type-badge ${badgeClass}">${account.type === 'credit_card' ? 'Credit' : account.type}</span>
          </div>
          <div class="dash-account-balance" style="color:${balanceColor};font-size:36px;">
            ${account.type === 'credit_card' ? '-' : ''}${formatCurrency(account.balance)}
          </div>
          ${account.credit_limit ? `<div class="dash-account-credit-limit">Credit limit: ${formatCurrency(account.credit_limit)} · Available: ${formatCurrency(account.credit_limit - account.balance)}</div>` : ''}
        </div>
        <h2 class="dash-section-title">
          <span>📋</span> Transaction History
        </h2>
        <div class="dash-transactions">
      `;

      if (transactions.length === 0) {
        html += '<div class="dash-no-transactions">No transactions yet</div>';
      } else {
        transactions.forEach(function(tx) {
          var isCredit = tx.type === 'credit';
          html += `
            <div class="dash-transaction-item">
              <div class="dash-tx-icon ${isCredit ? 'tx-credit' : 'tx-debit'}">${isCredit ? '↓' : '↑'}</div>
              <div class="dash-tx-info">
                <div class="dash-tx-desc">${tx.description}</div>
                <div class="dash-tx-date">${formatDate(tx.date)}</div>
              </div>
              <div class="dash-tx-amount ${isCredit ? 'tx-credit-amount' : 'tx-debit-amount'}">
                ${isCredit ? '+' : '-'}${formatCurrency(tx.amount)}
              </div>
            </div>
          `;
        });
      }

      html += '</div>';
      content.innerHTML = html;
    }

    function showMainView() {
      document.getElementById('main-view').style.display = 'block';
      document.getElementById('account-detail').style.display = 'none';
    }
  </script>

  <!-- Bottom Navigation -->
  <nav class="dash-bottom-nav">
    <a href="#" class="nav-item active">
      <svg viewBox="0 0 24 24" fill="currentColor" stroke="none" width="24" height="24"><path d="M12 3l10 9h-3v9H5v-9H2z"/></svg>
      <span>Accounts</span>
    </a>
    <a href="#" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="24" height="24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
      <span>Deposit</span>
    </a>
    <a href="#" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="24" height="24"><line x1="8" y1="11" x2="16" y2="11"/><line x1="8" y1="15" x2="16" y2="15"/><line x1="12" y1="8" x2="12" y2="18"/><circle cx="12" cy="12" r="10"/></svg>
      <span>Pay & Transfer</span>
    </a>
    <a href="#" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="24" height="24"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>
      <span>Explore</span>
    </a>
    <a href="#" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="24" height="24"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      <span>Menu</span>
    </a>
  </nav>

</body>
</html>
